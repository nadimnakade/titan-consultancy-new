<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Titan Consultancy</title>
    <link rel="stylesheet" href="app/bootstrap/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        body { 
            background-color: #f0f2f5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Sidebar Styles */
        .sidebar {
            background-color: #fff;
            height: 100vh;
            border-right: 1px solid #e1e4e8;
            padding-top: 20px;
            overflow-y: auto;
        }
        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 20px;
        }
        .nav-link {
            color: #555;
            padding: 12px 20px;
            border-radius: 0 25px 25px 0;
            margin-right: 10px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        .nav-link:hover {
            background-color: #f8f9fa;
            color: #0055FF;
        }
        .nav-link.active {
            background-color: #e7f1ff;
            color: #0055FF;
            font-weight: 600;
        }
        .nav-link i { margin-right: 10px; }

        /* Main Content Styles */
        .main-content {
            height: 100vh;
            overflow-y: auto;
            padding: 30px;
        }
        .content-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            padding: 30px;
            margin-bottom: 30px;
        }
        
        /* Form Styles */
        .form-label {
            font-weight: 600;
            color: #344767;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .form-control {
            border: 1px solid #e0e6ed;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #0055FF;
            box-shadow: 0 0 0 3px rgba(0, 85, 255, 0.1);
        }
        
        /* Floating Action Bar */
        .action-bar {
            position: fixed;
            bottom: 30px;
            right: 40px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        
        .btn-save {
            background: #0055FF;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 85, 255, 0.3);
            border: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }
        .btn-save:hover {
            background: #0044cc;
            transform: translateY(-2px);
            color: white;
        }
        
        .section-title {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f2f5;
            text-transform: capitalize;
        }
    </style>
</head>
<body>

<!-- Login Modal -->
<div id="loginModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center;">
    <div style="text-align: center; max-width: 400px; width: 90%; padding: 40px; background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
        <h3 class="mb-4 fw-bold text-primary">Admin Access</h3>
        <div class="mb-3">
            <input type="password" id="secretCode" class="form-control form-control-lg text-center" placeholder="Enter Secret Code">
        </div>
        <button class="btn btn-primary w-100 btn-lg" onclick="checkLogin()">Login</button>
        <p id="loginError" class="text-danger mt-3 small" style="display:none;">Invalid Code</p>
    </div>
</div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 sidebar">
            <div class="sidebar-header">
                <h5 class="mb-0 text-primary fw-bold">Titan Admin</h5>
                <small class="text-muted">Content Manager</small>
            </div>
            
            <nav class="nav flex-column" id="sidebarNav">
                <!-- Nav items generated via JS -->
            </nav>
            <div class="px-3 mt-3">
                <!-- No folder connect button needed, file access is handled on save if needed -->
            </div>
            <div class="mt-4 px-3">
                <a href="index.html" target="_blank" class="btn btn-outline-secondary w-100 btn-sm">
                    <i class="bi bi-box-arrow-up-right"></i> View Website
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 main-content">
            <div id="formsContainer">
                <div class="text-center py-5 mt-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3 text-muted">Loading content...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Floating Action Button -->
<div class="action-bar">
    <button id="btnSave" class="btn btn-save" onclick="saveChanges()">
        <i class="bi bi-cloud-upload"></i> Update Website
    </button>
</div>

<script src="app/js/jquery.min.js"></script>
<script>
    let currentContent = {};
    let fileHandle = null;

    function checkLogin() {
        const code = document.getElementById('secretCode').value;
        if (code === "12345678") {
            $('#loginModal').fadeOut();
            loadContent();
        } else {
            $('#loginError').show();
        }
    }

    // Allow Enter key for login
    $('#secretCode').keypress(function(e){
        if(e.which == 13) checkLogin();
    });

    function loadContent() {
        $.getJSON('assets/content.json', function(data) {
            currentContent = data;
            initAdmin(data);
        }).fail(function() {
            alert("Error: Could not load assets/content.json. Make sure the server is running and the file exists.");
        });
    }

    async function connectFolder() {
        // Removed directory picker
    }

    async function saveChanges() {
        // If we already have a file handle (from a previous save or open), write to it
        if (fileHandle) {
            try {
                const writable = await fileHandle.createWritable();
                await writable.write(JSON.stringify(currentContent, null, 4));
                await writable.close();
                showToast('Saved to content.json', 'success');
                return;
            } catch (e) {
                console.error("Write failed", e);
                // Fall through to download/picker
            }
        }

        // If no handle, try to open one directly (simpler than directory picker)
        if ('showOpenFilePicker' in window) {
            if (confirm("Do you want to save changes directly to your local content.json file? \n\nClick OK to select the file and save.\nClick Cancel to download the file instead.")) {
                try {
                    const [handle] = await window.showOpenFilePicker({
                        types: [{
                            description: 'JSON Files',
                            accept: {'application/json': ['.json']},
                        }],
                    });
                    fileHandle = handle; // Cache for next time
                    
                    const writable = await fileHandle.createWritable();
                    await writable.write(JSON.stringify(currentContent, null, 4));
                    await writable.close();
                    showToast('Saved directly to file!', 'success');
                    return;
                } catch (err) {
                    console.log("User cancelled or error", err);
                    // Fall through to download
                }
            }
        }

        // Fallback to download
        downloadJSON();
    }

    function showToast(message, type = 'primary') {
        const btn = $('#btnSave');
        // Temporarily change button content/style to show status
        const originalHtml = btn.html();
        
        btn.html(`<i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i> ${message}`);
        if(type === 'success') btn.css('background-color', '#28a745');
        if(type === 'danger') btn.css('background-color', '#dc3545');
        
        setTimeout(() => {
            btn.html('<i class="bi bi-cloud-upload"></i> Update Website');
            btn.css('background-color', ''); 
        }, 2500);
    }

    function initAdmin(data) {
        const nav = $('#sidebarNav');
        const container = $('#formsContainer');
        
        nav.empty();
        container.empty();

        let firstSection = true;

        // Iterate through top-level keys (Hero, About, Cards, etc.)
        for (const sectionKey in data) {
            // Add Nav Item
            const isActive = firstSection ? 'active' : '';
            const sectionName = sectionKey.charAt(0).toUpperCase() + sectionKey.slice(1);
            
            nav.append(`
                <a class="nav-link ${isActive}" onclick="scrollToSection('${sectionKey}')">
                    <i class="bi bi-journal-text"></i> ${sectionName}
                </a>
            `);

            // Create Section Form
            let formHtml = `
                <div id="section-${sectionKey}" class="content-card">
                    <h3 class="section-title">${sectionName} Section</h3>
                    <div class="row">
            `;

            // Generate fields for this section
            const sectionData = data[sectionKey];
            formHtml += generateFields(sectionData, sectionKey);

            formHtml += `
                    </div>
                </div>
            `;
            
            container.append(formHtml);
            firstSection = false;
        }
    }

    function generateFields(data, prefix) {
        let html = '';
        
        for (const key in data) {
            const value = data[key];
            const fullPath = `${prefix}.${key}`;
            const label = key.replace(/([A-Z])/g, ' $1') // Camel to Space
                             .replace(/_/g, ' ')         // Underscore to Space
                             .replace(/^./, str => str.toUpperCase()); // Capitalize first

            if (typeof value === 'object' && value !== null) {
                // Recursive for nested objects (like cards)
                html += `<div class="col-12 mt-4 mb-2"><h5 class="text-secondary border-bottom pb-2">${label}</h5></div>`;
                html += generateFields(value, fullPath);
            } else {
                // Determine Input Type
                const keyLower = key.toLowerCase();
                let inputField = '';

                // LOGIC: Textarea for descriptions, Input for everything else
                if (keyLower.includes('description') || keyLower.includes('content') || (typeof value === 'string' && value.length > 80)) {
                    inputField = `<textarea class="form-control" rows="4" onchange="updateContent('${fullPath}', this.value)">${value}</textarea>`;
                } else {
                    inputField = `<input type="text" class="form-control" value="${value}" onchange="updateContent('${fullPath}', this.value)">`;
                }

                html += `
                    <div class="col-md-12 mb-3">
                        <label class="form-label">${label}</label>
                        ${inputField}
                    </div>
                `;
            }
        }
        return html;
    }

    function updateContent(path, value) {
        const keys = path.split('.');
        let obj = currentContent;
        for (let i = 0; i < keys.length - 1; i++) {
            obj = obj[keys[i]];
        }
        obj[keys[keys.length - 1]] = value;
    }

    function scrollToSection(sectionId) {
        // Update Active Nav
        $('.nav-link').removeClass('active');
        $(`[onclick="scrollToSection('${sectionId}')"]`).addClass('active');

        // Scroll to Element
        const element = document.getElementById(`section-${sectionId}`);
        if (element) {
            element.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    function downloadJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentContent, null, 4));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "content.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        
        // Show success toast (simulated)
        const originalText = $('.btn-save').html();
        $('.btn-save').html('<i class="bi bi-check-circle"></i> Downloaded!');
        $('.btn-save').removeClass('btn-primary').addClass('btn-success');
        setTimeout(() => {
            $('.btn-save').html(originalText);
            $('.btn-save').removeClass('btn-success').addClass('btn-primary');
        }, 2000);
    }
</script>

</body>
</html>
